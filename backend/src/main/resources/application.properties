server.port=8080
spring.application.name=demo

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/santex_db
spring.datasource.username=santex_user
spring.datasource.password=santex_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Auth0 OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://presales-acceso-siga.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://presales-acceso-siga.us.auth0.com/api/v2/

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true

# Application Info
management.info.env.enabled=true
info.app.name=@project.name@
info.app.description=Santex Onboarding Task Management API
info.app.version=@project.version@
info.app.java.version=@java.version@
