server.port=8080
spring.application.name=demo

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/santex_db
spring.datasource.username=santex_user
spring.datasource.password=santex_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Auth0 OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://presales-acceso-siga.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://presales-acceso-siga.us.auth0.com/api/v2/
