# Development-specific configuration
# This profile is used for local development with PostgreSQL running on localhost

# PostgreSQL Configuration (Local)
spring.datasource.url=jdbc:postgresql://localhost:5432/santex_db
spring.datasource.username=santex_user
spring.datasource.password=santex_pass

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable detailed logging for development
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.demo=DEBUG
